server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The proxy's configuration API runs inside the VPN network namespace and
    # is reached through the gluetun container (hexstrike-vpn) on the shared
    # scanner-hexstrike-network. The name is resolved at request time via
    # Docker's embedded DNS so that a gluetun restart (which changes its IP)
    # does not leave the UI pointing at a stale address.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $config_api hexstrike-vpn:8890;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$config_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
