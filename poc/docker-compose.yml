services:

  # database for packets and annotations
  postgres:
    image: postgres:15
    container_name: ${DB_CONTAINER_NAME}
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT_HOST}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network
    healthcheck:
      # pg_isready by default attempts to connect to a database with the same name as the user.
      # The DB we create is `main`, so include `-d main` so the healthcheck targets the correct DB.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # web UI for browsing the database
  pgweb:
    image: sosedoff/pgweb
    container_name: pgweb
    restart: always
    ports:
      - "8081:8081"
    environment:
      - PGWEB_DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=disable
    networks:
      - app-network
    depends_on:
      - postgres

  # service for processing pcap files and inserting into the database
  pcap-processor:
    build: ./pcap_processing
    container_name: ${PCAP_PROCESSOR_CONTAINER_NAME}
    env_file:
      - ./.env
    volumes:
      - ./pcap_processing/parsing:/app/parsing
      - ./pcap_processing/util:/app/util
      - ./pcap_processing/reset_db.py:/app/reset_db.py
      - ./pcap_processing/run_pipeline_internal.sh:/app/run_pipeline_internal.sh
      - ./db:/app/db
      - ./.env:/app/.env:ro
    networks:
      - app-network
    depends_on:
      - postgres
    tty: true

  # service for exposing the packet database via MCP
  mcp-packet-db:
    build: ./mcp/packet_db_server
    container_name: mcp-packet-db
    env_file:
      - ./.env
    environment:
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8765
    ports:
      - "8765:8765"
    networks:
      - app-network
    depends_on:
      - postgres

  # penetration testing MCP tools
  mcp-hexstrike:
    build: ./mcp/hexstrike
    container_name: mcp-hexstrike
    restart: unless-stopped
    environment:
      - HEXSTRIKE_MODE=mcp-http
      - HEXSTRIKE_ENABLE_BASH_MCP=1
      - HEXSTRIKE_BASH_MCP_HOST=0.0.0.0
      - HEXSTRIKE_BASH_MCP_PORT=8766
      - HEXSTRIKE_BASH_MCP_TRANSPORT=streamable-http
      - HEXSTRIKE_BASH_MCP_CWD=/workspace
      - HEXSTRIKE_BASH_MCP_TIMEOUT=900
      - HEXSTRIKE_BASH_MCP_MAX_TIMEOUT=3600
      - HEXSTRIKE_MCP_HTTP_HOST=0.0.0.0
      - HEXSTRIKE_MCP_HTTP_PORT=8767
      - HEXSTRIKE_MCP_HTTP_TIMEOUT=900
    ports:
      - "8766:8766"
      - "8767:8767"
    networks:
      - app-network
    tty: true
    stdin_open: true

  # LLM based network packet grouping/aggregation into events
  grouping:
    build: ./grouping
    container_name: grouping
    command: ["bash", "-lc", "sleep infinity"]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MCP_URL=http://mcp-packet-db:8765
      - PYTHONPATH=/app/src:/app/mcp_packet_db_server/src
    volumes:
      - ./grouping:/app
      - ./mcp/packet_db_server/src:/app/mcp_packet_db_server/src:ro
      - ./.env:/app/.env:ro
      - ollama_models:/root/.ollama
    networks:
      - app-network
    depends_on:
      - mcp-packet-db
    tty: true
    stdin_open: true

  # LLM runtime for vulnerability-assessment phase-one/two workflows
  scanner-llm:
    build: ./vuln_scan/backend/llm
    container_name: scanner-llm
    command: ["bash", "-lc", "ollama serve > /tmp/ollama.log 2>&1 & sleep infinity"]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MCP_URL=http://mcp-packet-db:8765
    volumes:
      - ./vuln_scan/backend/llm:/app
      - ./vuln_scan/data:/app/data
      - ./.env:/app/.env:ro
      - ollama_models:/root/.ollama
    networks:
      - app-network
    depends_on:
      - mcp-packet-db
    tty: true
    stdin_open: true

  # HTTP API for the vulnerability scanner frontend
  scanner-api:
    build:
      context: ./vuln_scan
      dockerfile: backend/api/Dockerfile
    container_name: scanner-api
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - MCP_URL=http://mcp-packet-db:8765
      - OLLAMA_HOST=http://scanner-llm:11434
      - APP_DETAILS=/data/app_details.txt
      - USER_INTEND=/data/user_intend.txt
      - PHASE2_MCP_SERVERS=packet=http://mcp-packet-db:8765,hexstrike=http://mcp-hexstrike:8767,bash=http://mcp-hexstrike:8766
      - PHASE2_MCP_TOOL_TIMEOUT_SECONDS=900
      - PHASE2_APPROVAL_TIMEOUT_SECONDS=3600
    volumes:
      - ./vuln_scan/backend/api:/app
      - ./vuln_scan/backend/llm:/llm
      - ./vuln_scan/data:/data:ro
    ports:
      - "8090:8000"
    networks:
      - app-network
    depends_on:
      - mcp-packet-db
      - mcp-hexstrike
      - scanner-llm

  # Web UI for selecting events and running phase-one summaries
  scanner-frontend:
    build: ./vuln_scan/frontend
    container_name: scanner-frontend
    restart: unless-stopped
    ports:
      - "8091:80"
    networks:
      - app-network
    depends_on:
      - scanner-api

volumes:
  postgres_data:
    driver: local
  ollama_models:
    driver: local

networks:
  app-network:
    driver: bridge
