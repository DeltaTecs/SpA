services:
  postgres:
    image: postgres:15
    container_name: ${DB_CONTAINER_NAME}
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT_HOST}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network
    healthcheck:
      # pg_isready by default attempts to connect to a database with the same name as the user.
      # The DB we create is `main`, so include `-d main` so the healthcheck targets the correct DB.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgweb:
    image: sosedoff/pgweb
    container_name: pgweb
    restart: always
    ports:
      - "8081:8081"
    environment:
      - PGWEB_DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=disable
    networks:
      - app-network
    depends_on:
      - postgres

  pcap-processor:
    build: ./pcap_processing
    container_name: ${PCAP_PROCESSOR_CONTAINER_NAME}
    volumes:
      - ./pcap_processing/parsing:/app/parsing
      - ./pcap_processing/util:/app/util
      - ./pcap_processing/reset_db.py:/app/reset_db.py
      - ./pcap_processing/run_pipeline_internal.sh:/app/run_pipeline_internal.sh
      - ./db:/app/db
      - ./.env:/app/.env:ro
    networks:
      - app-network
    depends_on:
      - postgres
    tty: true

  mcp-packet-db:
    build: ./mcp/packet_db_server
    container_name: mcp-packet-db
    env_file:
      - ./.env
    environment:
      - MCP_TRANSPORT=sse
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8765
    ports:
      - "8765:8765"
    networks:
      - app-network
    depends_on:
      - postgres

  grouping:
    build: ./grouping
    container_name: grouping
    command: ["bash", "-lc", "sleep infinity"]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./grouping/packet_analyzer.py:/app/packet_analyzer.py
      - ./grouping/run_grouping_internal.sh:/app/run_grouping_internal.sh
      - ./.env:/app/.env:ro
      - ollama_models:/root/.ollama
    networks:
      - app-network
    depends_on:
      - postgres
    tty: true
    stdin_open: true

volumes:
  postgres_data:
    driver: local
  ollama_models:
    driver: local

networks:
  app-network:
    driver: bridge
