services:

  # database for packets and annotations
  postgres:
    image: postgres:15
    container_name: ${DB_CONTAINER_NAME}
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT_HOST}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network
    healthcheck:
      # pg_isready by default attempts to connect to a database with the same name as the user.
      # The DB we create is `main`, so include `-d main` so the healthcheck targets the correct DB.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # web UI for browsing the database
  pgweb:
    image: sosedoff/pgweb
    container_name: pgweb
    restart: always
    ports:
      - "8081:8081"
    environment:
      - PGWEB_DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=disable
    networks:
      - app-network
    depends_on:
      - postgres

  # service for processing pcap files and inserting into the database
  pcap-processor:
    build: ./pcap_processing
    container_name: ${PCAP_PROCESSOR_CONTAINER_NAME}
    env_file:
      - ./.env
    volumes:
      - ./pcap_processing/parsing:/app/parsing
      - ./pcap_processing/util:/app/util
      - ./pcap_processing/reset_db.py:/app/reset_db.py
      - ./pcap_processing/run_pipeline_internal.sh:/app/run_pipeline_internal.sh
      - ./db:/app/db
      - ./.env:/app/.env:ro
    networks:
      - app-network
    depends_on:
      - postgres
    tty: true

  # service for exposing the packet database via MCP
  mcp-packet-db:
    build: ./mcp/packet_db_server
    container_name: mcp-packet-db
    env_file:
      - ./.env
    environment:
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8765
    ports:
      - "8765:8765"
    networks:
      - app-network
    depends_on:
      - postgres

  # penetration testing MCP tools
  mcp-hexstrike:
    build: ./mcp/hexstrike
    container_name: mcp-hexstrike
    restart: unless-stopped
    environment:
      - HEXSTRIKE_MODE=bash-mcp
      - HEXSTRIKE_BASH_MCP_HOST=0.0.0.0
      - HEXSTRIKE_BASH_MCP_PORT=8766
      - HEXSTRIKE_BASH_MCP_TRANSPORT=streamable-http
      - HEXSTRIKE_BASH_MCP_CWD=/workspace
    ports:
      - "8766:8766"
    networks:
      - app-network
    tty: true
    stdin_open: true

  # LLM based network packet grouping/aggregation into events
  grouping:
    build: ./grouping
    container_name: grouping
    command: ["bash", "-lc", "sleep infinity"]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MCP_URL=http://mcp-packet-db:8765
    volumes:
      - ./grouping:/app
      - ./.env:/app/.env:ro
      - ollama_models:/root/.ollama
    networks:
      - app-network
    depends_on:
      - mcp-packet-db
    tty: true
    stdin_open: true

  # LLM based vulnerability-assessment phase-one summarizer for grouped events
  scanner:
    build: ./vuln_scan
    container_name: scanner
    command: ["bash", "-lc", "sleep infinity"]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MCP_URL=http://mcp-packet-db:8765
    volumes:
      - ./vuln_scan:/app
      - ./.env:/app/.env:ro
      - ollama_models:/root/.ollama
    networks:
      - app-network
    depends_on:
      - mcp-packet-db
    tty: true
    stdin_open: true

volumes:
  postgres_data:
    driver: local
  ollama_models:
    driver: local

networks:
  app-network:
    driver: bridge
