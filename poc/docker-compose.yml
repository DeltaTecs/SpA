services:

  # database for packets and annotations
  db:
    image: postgres:15
    container_name: ${DB_CONTAINER_NAME}
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT_HOST}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Mount only the bootstrap SQL; mounting ./db here also runs helper scripts.
      - ./db/init_db.sql:/docker-entrypoint-initdb.d/init_sb.sql:ro
    networks:
      - app-network
    healthcheck:
      # pg_isready by default attempts to connect to a database with the same name as the user.
      # The DB we create is `main`, so include `-d main` so the healthcheck targets the correct DB.
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # web UI for browsing the database
  pgweb:
    image: sosedoff/pgweb
    container_name: pgweb
    restart: always
    ports:
      - "8081:8081"
    environment:
      - PGWEB_DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=disable
    networks:
      - app-network
    depends_on:
      - db

  # service for processing pcap files and inserting into the database
  pcap-processor:
    build: ./pcap_processing
    container_name: ${PCAP_PROCESSOR_CONTAINER_NAME}
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./pcap_processing/parsing:/app/parsing
      - ./pcap_processing/util:/app/util
      - ./pcap_processing/reset_db.py:/app/reset_db.py
      - ./pcap_processing/run_pipeline_internal.sh:/app/run_pipeline_internal.sh
      - ./db:/app/db
    networks:
      - app-network
    depends_on:
      - db
    tty: true

  # HTTP API for reading packet data from the database
  db-api:
    build: ./db/api
    container_name: db-api
    restart: unless-stopped
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - LOG_LEVEL=VERBOSE
      - LOG_DIR=/app/logs
    volumes:
      # Centralise file logs under poc/logs alongside the other services.
      - ./logs:/app/logs
    ports:
      - "8092:8000"
    networks:
      # app-network for reaching the database; db-api-network for consumers.
      - app-network
      - db-api-network
    depends_on:
      - db
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 5

  # Web frontend: serves the React SPA and proxies /api/* to db-api and
  # /api/plan/* to the scanner-backend.
  frontend:
    build: ./scanner/frontend
    container_name: scanner-frontend
    restart: unless-stopped
    environment:
      - DB_API_URL=http://db-api:8000
      - BACKEND_URL=http://scanner-backend:8000
      - LOG_LEVEL=VERBOSE
      - FRONTEND_LOG_DIR=/app/logs
    volumes:
      - ./logs:/app/logs
    ports:
      - "8093:8000"
    networks:
      # Dedicated consumer network used to reach the db-api by service name.
      - db-api-network
    depends_on:
      - db-api
      - scanner-backend
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 5

  # LLM scan-planning backend: wraps scanner/backend/llm + MCP tools and runs
  # concurrent analysis sessions. Reached by the frontend's /api/plan/* proxy.
  scanner-backend:
    build: ./scanner/backend
    container_name: scanner-backend
    restart: unless-stopped
    environment:
      - MCP_PACKET_DB_URL=http://mcp-packet-db:8765/mcp
      # Active-testing MCP tools (bash + hexstrike), reached over the hexstrike
      # network via the mcp-hexstrike alias on hexstrike-vpn.
      - HEXSTRIKE_BASH_MCP_URL=http://mcp-hexstrike:8766/mcp
      - HEXSTRIKE_TOOLS_MCP_URL=http://mcp-hexstrike:8767/mcp
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - PLAN_MAX_CONCURRENCY=${PLAN_MAX_CONCURRENCY:-4}
      - LOG_LEVEL=VERBOSE
      - LLM_LOG_DIR=/app/logs
    volumes:
      - ./logs:/app/logs
    ports:
      - "8094:8000"
    networks:
      # app-network reaches mcp-packet-db; db-api-network is reachable by frontend;
      # scanner-hexstrike-network reaches the bash/hexstrike MCP tools.
      - app-network
      - db-api-network
      - scanner-hexstrike-network
    depends_on:
      - mcp-packet-db
      - mcp-hexstrike
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 5

  # service for exposing the packet database via MCP
  mcp-packet-db:
    build: ./mcp/packet_db_server
    container_name: mcp-packet-db
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8765
      - LOG_LEVEL=VERBOSE
    ports:
      - "8765:8765"
    networks:
      - app-network
    depends_on:
      - db

  # VPN egress for active HexStrike tooling. If PROTONVPN_WIREGUARD_PRIVATE_KEY
  # is unset, this container stays up as a plain network namespace and
  # HexStrike uses normal Docker egress.
  hexstrike-vpn:
    image: qmcgaw/gluetun:v3
    container_name: hexstrike-vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    entrypoint:
      - /bin/sh
      - -c
      - |
        if printenv WIREGUARD_PRIVATE_KEY | grep -q .; then
          exec /gluetun-entrypoint
        fi
        echo "PROTONVPN_WIREGUARD_PRIVATE_KEY is not set; running HexStrike without VPN egress."
        exec tail -f /dev/null
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${PROTONVPN_WIREGUARD_PRIVATE_KEY:-}
      - SERVER_COUNTRIES=${PROTONVPN_SERVER_COUNTRIES:-Netherlands}
      - FIREWALL_INPUT_PORTS=8766,8767
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - gluetun_data:/gluetun
    networks:
      scanner-hexstrike-network:
        aliases:
          - mcp-hexstrike

  # Penetration testing MCP tools.
  mcp-hexstrike:
    build: ./mcp/hexstrike
    container_name: mcp-hexstrike
    restart: unless-stopped
    network_mode: "service:hexstrike-vpn"
    environment:
      - HEXSTRIKE_MODE=mcp-http
      - HEXSTRIKE_ENABLE_BASH_MCP=1
      - HEXSTRIKE_BASH_MCP_HOST=0.0.0.0
      - HEXSTRIKE_BASH_MCP_PORT=8766
      - HEXSTRIKE_BASH_MCP_TRANSPORT=streamable-http
      - HEXSTRIKE_BASH_MCP_CWD=/workspace
      - HEXSTRIKE_BASH_MCP_TIMEOUT=900
      - HEXSTRIKE_BASH_MCP_MAX_TIMEOUT=3600
      - HEXSTRIKE_MCP_HTTP_HOST=0.0.0.0
      - HEXSTRIKE_MCP_HTTP_PORT=8767
      - HEXSTRIKE_MCP_HTTP_TIMEOUT=900
      - LOG_LEVEL=VERBOSE
    depends_on:
      - hexstrike-vpn
    tty: true
    stdin_open: true

volumes:
  db_data:
    driver: local
  gluetun_data:
    driver: local

networks:
  app-network:
    driver: bridge
  scanner-hexstrike-network:
    driver: bridge
  # Dedicated network for consumers of the packet database read API.
  db-api-network:
    driver: bridge
